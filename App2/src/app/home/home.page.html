<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Blank
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="usuario" (ngSubmit)="guardarDatos()">
    <ion-item>
      <ion-label>Nombre:</ion-label>
      <ion-input formControlName="nombre"></ion-input>
    </ion-item>

    <ion-label color="danger"
      *ngIf="usuario.controls.nombre.errors?.['required'] && (usuario.touched || usuario.dirty)">*
      El nombre es obligatorio </ion-label>

    <ion-label color="danger"
      *ngIf="usuario.controls.nombre.errors?.['minlength'] && (usuario.touched || usuario.dirty)">*
      El nombre tiene que tener al menos 4 caracteres.</ion-label>

    <ion-item>
      <ion-label>Email:</ion-label>
      <ion-input formControlName="email"></ion-input>
    </ion-item>

    <ion-label color="danger" *ngIf="usuario.controls.email.errors?.['email'] && (usuario.touched || usuario.dirty)">*
      El
      email no es válido.</ion-label>

    <p class="ion-text-center">
      <ion-button type="submit" [disabled]="!usuario.valid">Guardar</ion-button>
    </p>
  </form>
  <p class="ion-padding">{{ usuario.controls.nombre.value }}</p>
  <p class="ion-text-center">
    <ion-button (click)="enviarFormulario()">Cambiar nombre</ion-button>
  </p>
</ion-content>
